<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inbox">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Rex Inbox</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="topbar"><span class="t" id="topbar-title">Inbox</span></div>
  <header id="hero">
    <h1 id="title">Inbox</h1>
    <p id="summary"><span class="dot wait"></span><span id="summary-text">Connecting…</span></p>
  </header>
  <div id="notice"></div>
  <nav id="filters" hidden></nav>
  <main id="main"></main>
  <nav id="tabbar" class="glass" role="tablist"></nav>
  <div id="toast" class="glass" role="status" aria-live="polite"></div>
  <div id="scrim"></div>
  <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  <script src="/app.js"></script>
</body>
</html>
