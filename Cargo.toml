[package]
name = "rex-inbox"
version = "0.2.0"
edition = "2024"
description = "Everything your Rex agents need from you: one inbox, messages between agents, and guarded approvals"
license = "MIT"
repository = "https://github.com/captjt/rex-inbox"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "local-offset"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
web-push-native = "0.5.0"
